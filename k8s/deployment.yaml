apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo-service
  namespace: observability-demo
  labels:
    app: observability-demo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-demo-service
  template:
    metadata:
      labels:
        app: observability-demo-service
      annotations:
        # Fallback scrape method if the Prometheus Operator / ServiceMonitor
        # CRD isn't installed on the cluster — plain Prometheus honors these
        # annotations directly. See monitoring/prometheus/prometheus.yml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: observability-demo-service:local   # built by the Jenkins pipeline; see ci/Jenkinsfile
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ERROR_RATE
              value: "0.1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: observability-demo-service
  namespace: observability-demo
  labels:
    app: observability-demo-service
spec:
  selector:
    app: observability-demo-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
